name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-ci.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Run Python tests
        env:
          VANTAGE_DATA_DIR: ${{ runner.temp }}\Vantage\data
          VANTAGE_CONFIG_DIR: ${{ runner.temp }}\Vantage\config
          VANTAGE_HISTORY_DIR: ${{ runner.temp }}\Vantage\history
          VANTAGE_LOG_DIR: ${{ runner.temp }}\Vantage\logs
          VANTAGE_PLOT_DIR: ${{ runner.temp }}\Vantage\plot_outputs
          VANTAGE_CACHE_DIR: ${{ runner.temp }}\Vantage\cache
          VANTAGE_RUNTIME_DIR: ${{ runner.temp }}\Vantage\runtime
          VANTAGE_MIGRATION_DIR: ${{ runner.temp }}\Vantage\migration
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: src/webapp/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/webapp
      - name: Run frontend tests
        run: npm test
        working-directory: src/webapp
      - name: Build frontend
        run: npm run build
        working-directory: src/webapp

  macos-runtime-smoke:
    name: macOS packaged runtime smoke (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-backend-runtime-gpu.txt
      - name: Install packaged runtime dependencies in an isolated environment
        run: |
          python -m venv .venv-runtime-smoke
          .venv-runtime-smoke/bin/python -m pip install --upgrade pip
          .venv-runtime-smoke/bin/python -m pip install -r requirements-backend-runtime-gpu.txt
      - name: Check packaged runtime dependencies
        run: .venv-runtime-smoke/bin/python -m pip check
      - name: Prewarm OpenCV YuNet detector
        run: |
          .venv-runtime-smoke/bin/python -c "import cv2, numpy as np; from pathlib import Path; model = Path('src/models/face_detection_yunet_2023mar.onnx'); detector = cv2.FaceDetectorYN_create(str(model), '', (640, 640), 0.5, 0.3, 5000); assert detector is not None; detector.detect(np.zeros((640, 640, 3), dtype=np.uint8))"
      - name: Check macOS launcher syntax
        run: bash -n RUN.sh RUN_DEV.sh
